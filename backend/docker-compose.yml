services:
  postgres:
    image: postgres:16-alpine
    container_name: educacao-alagoas-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: educacao
      POSTGRES_PASSWORD: educacao
      POSTGRES_DB: educacao_alagoas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educacao -d educacao_alagoas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
